name: Update Friends Feed Cache

on:
  push:
    branches:
      - master
    paths-ignore:
      - "src/data/friends-feed-cache.json"
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-friends-feed-cache
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout blog
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Update feed cache
        timeout-minutes: 8
        env:
          RSS_FETCH_TIMEOUT_MS: 4000
          RSS_FETCH_CONCURRENCY: 10
          RSS_VERBOSE_ERRORS: 1
        run: npm run feeds:update

      - name: Commit feed cache
        timeout-minutes: 3
        run: |
          branch="${GITHUB_REF_NAME:-master}"

          if git diff --quiet -- src/data/friends-feed-cache.json; then
            echo "No feed cache changes."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git pull --rebase --autostash origin "$branch"
          git add src/data/friends-feed-cache.json
          git commit -m "Update friends feed cache"
          git push origin "HEAD:$branch"
